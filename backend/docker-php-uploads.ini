; Sized for the largest upload the app accepts: a backup archive for restore
; (UploadBackupRequest allows 500 MB). Anything above post_max_size never
; reaches Laravel — PHP drops the body and ValidatePostSize throws
; PostTooLargeException before validation can produce a readable message.
upload_max_filesize = 512M
post_max_size       = 512M
max_execution_time  = 120
; Uploads stream to a temp file, so memory_limit does not need to follow.
memory_limit        = 256M
